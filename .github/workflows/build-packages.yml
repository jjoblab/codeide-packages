name: Build APT Repo (aarch64)

# ===========================================================================
# CodeIDE Packages — APT repository builder (aarch64 only)
# ===========================================================================
#
# Builds .deb files for every package listed in `packages.txt` and
# publishes them to a GitHub Pages-hosted APT repository at
# `https://jjoblab.github.io/codeide-packages/apt/codeide-main`.
#
# Bootstrap packages (bash, apt, coreutils, termux-core, ...) are NOT
# built here — they are built by `build-bootstrap-aarch64.yml`. The
# APT repo produced by this workflow is meant for installing additional
# packages on an already-bootstrapped CodeIDE shell.
#
# Trigger:
#   - manual (workflow_dispatch)
#   - on push of a `packages-*` tag
#   - weekly (Sunday 00:00 UTC)
# ===========================================================================

on:
  workflow_dispatch:
  push:
    tags:
      - 'packages-*'
  schedule:
    # Hebdomadaire : dimanche 00:00 UTC
    - cron: "0 0 * * 0"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_arch:
          - aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore executable bits on shell scripts
        # Defensive: fixes Permission denied (exit 126) if the commit was
        # pushed from Android/Termux where core.filemode defaults to false.
        # See fix-permissions.sh for details.
        run: bash fix-permissions.sh --no-commit

      - name: Read package list
        id: pkglist
        run: |
          if [ -f packages.txt ]; then
            PACKAGES=$(grep -vE '^[[:space:]]*(#|$)' packages.txt | tr '\n' ' ')
            echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
            echo "=== Packages à builder pour ${{ matrix.target_arch }} ==="
            echo "$PACKAGES"
          else
            echo "❌ packages.txt introuvable"
            exit 1
          fi

      - name: Prepare host mount directories
        # MUST run BEFORE the cache step so that /data/data/.built-packages/
        # exists when the cache tries to restore files into it.
        # Also creates output/ dir for cached .deb files.
        run: |
          sudo mkdir -p /data/data/.built-packages
          sudo chown -R "$(id -u):$(id -g)" /data
          mkdir -p ~/.termux-build
          mkdir -p output

      - name: Cache termux build directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.termux-build
            /data
            output
          key: codeide-apt-${{ matrix.target_arch }}-${{ hashFiles('packages.txt', 'packages/**/build.sh') }}
          restore-keys: |
            codeide-apt-${{ matrix.target_arch }}-
          save-always: true

      - name: Build packages (natif jo.codeide, depuis les sources)
        # ★ Build NATIF — sans -I. On NE télécharge PAS de .deb précompilés
        # depuis termux.dev (qui contiendraient /data/data/com.termux/...).
        # Toutes les dépendances sont compilées depuis les sources de ce repo.
        # C'est plus long mais garantit un dépôt APT 100% jo.codeide.
        # -m monte ~/.termux-build et /data depuis l'hôte (cf. étape de cache
        # ci-dessus) pour réutiliser les paquets déjà construits.
        run: |
          set -euo pipefail
          mkdir -p ./debs
          ./scripts/run-docker.sh -m ./build-package.sh -a ${{ matrix.target_arch }} ${{ steps.pkglist.outputs.packages }}

      - name: Collect built .deb
        run: |
          mkdir -p ./debs-${{ matrix.target_arch }}
          find . -name '*.deb' -path '*/output/*' -exec mv {} ./debs-${{ matrix.target_arch }}/ \; 2>/dev/null || true
          find . -name '*.deb' -not -path './debs-*' -exec mv {} ./debs-${{ matrix.target_arch }}/ \; 2>/dev/null || true
          # GitHub Actions artifacts n'acceptent pas les ":" dans les noms de
          # fichiers (limitation NTFS). Or les .deb Debian utilisent parfois
          # l'epoch versioning (ex: "1:2026.07.16"). On remplace ":" par "_"
          # pour tous les fichiers qui en contiennent.
          cd ./debs-${{ matrix.target_arch }}
          RENAMED=0
          for f in *\:*; do
            [ -e "$f" ] || continue
            new_name="${f//:/_}"
            mv -f "$f" "$new_name"
            RENAMED=$((RENAMED+1))
            echo "  Renamed: $f → $new_name"
          done
          if [ "$RENAMED" -gt 0 ]; then
            echo "  ✓ Renamed $RENAMED file(s) with ':' in name"
          fi
          # Génère les sommes de contrôle
          md5sum *.deb > MD5SUMS 2>/dev/null || true
          sha256sum *.deb > SHA256SUMS 2>/dev/null || true
          echo "=== Total .deb pour ${{ matrix.target_arch }} : $(ls *.deb 2>/dev/null | wc -l) ==="

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.target_arch }}
          path: ./debs-${{ matrix.target_arch }}/
          retention-days: 30

  publish-repo:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install aptly
        run: |
          curl -sL https://www.aptly.info/pubkey.txt | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/aptly.gpg > /dev/null
          echo "deb http://repo.aptly.info/ squeeze main" | sudo tee /etc/apt/sources.list.d/aptly.list
          sudo apt-get update -qq
          sudo apt-get install -y aptly gpg

      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-debs
          merge-multiple: false

      - name: Merge all .deb into single directory
        run: |
          mkdir -p ./debs-all
          find ./all-debs -name "*.deb" -exec mv {} ./debs-all/ \;
          echo "=== Total .deb files : $(ls ./debs-all/*.deb 2>/dev/null | wc -l) ==="

      - name: Create apt repo with aptly
        env:
          APTLY_HOME: /home/runner/.aptly
        run: |
          set -euo pipefail

          # Fail-fast : si aucun .deb n'a été produit, ne pas publier un repo vide.
          DEB_COUNT=$(find ./debs-all -name '*.deb' | wc -l)
          echo "=== .deb trouvés : $DEB_COUNT ==="
          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "❌ ERREUR : aucun .deb dans ./debs-all/. Les jobs de build ont dû échouer."
            find ./all-debs -maxdepth 3 -type f | head -20 || true
            exit 1
          fi

          # IMPORTANT : heredoc non-quoté (<<EOF, pas <<'EOF') pour que
          # $APTLY_HOME soit bien substitué dans le JSON. Avec 'EOF',
          # aptly prenait la chaîne littérale "$HOME/.aptly" et créait
          # public/ dans ./$HOME/.aptly/public/ au lieu de
          # /home/runner/.aptly/public/.
          mkdir -p "$APTLY_HOME"
          cat > "$HOME/.aptly.conf" <<EOF
          {
            "rootDir": "$APTLY_HOME",
            "downloadConcurrency": 4,
            "downloadSpeedLimit": 0,
            "architectures": ["aarch64", "all"],
            "dependencyFollowSuggests": false,
            "dependencyFollowRecommends": false,
            "dependencyFollowAllVariants": false,
            "dependencyFollowSource": false,
            "gpgDisableSign": true,
            "gpgDisableVerify": true,
            "downloadSourcePackages": false,
            "ppaDistributorID": "ubuntu",
            "ppaDistributorCodename": "",
            "skipContentsPublishing": false,
            "FileSystemPublishEndpoints": {},
            "S3PublishEndpoints": {},
            "SwiftPublishEndpoints": {}
          }
          EOF

          # Vérifie que le JSON est bien formé et que rootDir est résolu
          python3 -c "import json; c=json.load(open('$HOME/.aptly.conf')); print('rootDir =', c['rootDir'])"

          # Créer le repo
          aptly repo create \
            -distribution=stable \
            -component=main \
            codeide-main

          # Importer tous les .deb
          aptly repo add codeide-main ./debs-all/

          # Vérifier que le repo n'est pas vide après import
          REPO_INFO=$(aptly repo show codeide-main 2>&1)
          echo "$REPO_INFO"
          if echo "$REPO_INFO" | grep -q "Packages: 0"; then
            echo "❌ ERREUR : aptly repo add n'a rien importé (repo vide)"
            exit 1
          fi

          # Publier le repo (filesystem, pas de GPG sign pour l'instant)
          aptly publish repo \
            -architectures="aarch64,all" \
            -skip-signing \
            codeide-main

          echo "=== Contenu de $APTLY_HOME/public/ ==="
          ls -la "$APTLY_HOME/public/"

      - name: Prepare GitHub Pages content
        env:
          APTLY_HOME: /home/runner/.aptly
        run: |
          set -euo pipefail
          mkdir -p ./gh-pages/apt/codeide-main
          cp -r "$APTLY_HOME/public/"* ./gh-pages/apt/codeide-main/

          # Créer index.html simple
          cat > ./gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>CodeIDE APT Repository</title></head>
          <body>
          <h1>CodeIDE APT Repository</h1>
          <p>Add this to your sources.list:</p>
          <pre>deb https://jjoblab.github.io/codeide-packages/apt/codeide-main stable main</pre>
          </body></html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: false
